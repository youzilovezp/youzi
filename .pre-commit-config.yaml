# /youzi 工程 pre-commit 配置
#
# 工程结构:
#   render.py                                                 渲染主入口
#   adapters/{__init__,crawl4ai,firecrawl,playwright}.py      爬虫 adapter
#   templates/*.html                                          自研 {% %} 模板
#   examples/*.{html,json}                                    样例 (含生成输出)
#   references/*.md, README.md, SKILL.md, 快速/进阶/小白入门.md  文档
#   scripts/*.py                                              本地 hook 辅助脚本
#
# 工具: ruff 0.14.8 / mypy / typos / gitleaks 都在系统 PATH
# 注: 没有 .venv/, ruff 走官方 ruff-pre-commit 镜像,本地 hook 直接调系统命令
#
# 阶段策略:
#   pre-commit —— 通用卫生 + ruff(format/check --fix), 跑必过
#   manual     —— mypy / typos / markdownlint / render-smoke, 不挡 commit,
#                 维护者按需跑观察基线
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # 通用卫生
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      - id: detect-private-key

  # Python: ruff(format + lint --fix)
  # 走官方镜像, 不依赖 .venv; rev 跟系统 ruff 0.14.8 对齐
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  # Markdown: markdownlint-cli2
  # 文档以中文为主, 默认规则对 CJK 偏严; 配置见 .markdownlint-cli2.jsonc
  # 仅在 manual stage, 不挡 commit (现网文档有历史违规, 边修边跑)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        stages: [manual]

  # Secret 扫描: gitleaks
  # 与 detect-private-key 互补 —— 后者只抓 PEM, 前者覆盖 160+ 模式 (GitHub/AWS/FC/API key 等)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 本地工具: mypy / typos / render-smoke
  # 全部 manual stage —— 不挡 commit, 维护者按需跑观察基线
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: Static type-check Python sources.
        entry: mypy --python-version 3.11 --no-incremental render.py adapters
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
      - id: typos
        name: typos
        description: Check typos in source files.
        entry: typos
        language: system
        types_or: [text, python, markdown]
        pass_filenames: false
        stages: [manual]
      - id: render-smoke
        name: render template smoke test
        description: Run render.py against examples JSON to confirm templates/report.html still parses.
        entry: python3 scripts/render_smoke.py
        language: system
        pass_filenames: false
        files: ^(render\.py|adapters/.*\.py|templates/.*\.html)$
        stages: [manual]
